name: Bug report
description: Report a reproducible JuDoctor problem
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test JuDoctor on real Windows hardware.
        Do not upload databases/logs before reviewing them for machine-specific information.

  - type: input
    id: version
    attributes:
      label: JuDoctor version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: "Intel Core i5-10400F"
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: "NVIDIA GeForce RTX 3050"
    validations:
      required: false

  - type: input
    id: ram
    attributes:
      label: Installed RAM
      placeholder: "32 GB"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect JuDoctor to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start JuDoctor
        2. ...
    validations:
      required: true

  - type: input
    id: time
    attributes:
      label: Approximate incident time
      description: Helpful for matching local history if the bug concerns monitoring/diagnosis.
      placeholder: "2026-09-18 14:30 local time"
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed any evidence I plan to attach and removed sensitive/private information.
          required: true
